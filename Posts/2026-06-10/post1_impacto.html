<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;}
  body{font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;background:#1a1210;}
  .photo{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;z-index:0;}
  /* profundidade: escurece topo e base para a marca/headline respirarem */
  .shade{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(26,18,16,0.42) 0%,rgba(26,18,16,0.05) 26%,rgba(26,18,16,0.05) 50%,rgba(26,18,16,0.55) 100%);}
  /* moldura dourada da marca */
  .frame{position:absolute;inset:46px;border:1.6px solid rgba(219,192,120,0.9);z-index:2;}
  /* logo branco no topo */
  .logo{position:absolute;top:92px;left:50%;transform:translateX(-50%);height:200px;z-index:4;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.35));}
  /* cartão marfim translúcido com a chamada */
  .card{position:absolute;left:110px;right:110px;bottom:150px;z-index:3;
    background:rgba(255,253,248,0.94);padding:62px 56px 58px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,0.28);}
  .kicker{font-family:'DM Sans',sans-serif;font-weight:600;font-size:27px;letter-spacing:7px;
    text-transform:uppercase;color:#c2a06a;margin-bottom:26px;}
  h1{font-family:'Playfair Display',serif;font-weight:600;font-size:70px;line-height:1.13;
    color:#6c000f;letter-spacing:0.3px;}
  .rule{width:84px;height:2px;background:#dbc078;margin:30px auto 0;}
  .handle{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:4;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:25px;letter-spacing:2px;
    color:#FFFDF8;opacity:0.92;filter:drop-shadow(0 1px 6px rgba(0,0,0,0.5));}
