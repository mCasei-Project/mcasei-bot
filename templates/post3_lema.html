<!DOCTYPE html>
<!--
  mCasei — Template Post 3 (Lema) — 1080x1350px — fundo escuro fixo
  Placeholders: {{TAG}} {{LEMA}} {{ASSINATURA}} {{PRIMARY}}
  Logo na mesma pasta: logo-white.png
-->
<html lang="pt">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body {
    background:#1A1A1A; color:#F7F3EE;
    font-family:'Nunito Sans',sans-serif;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .circle { position:absolute; border-radius:50%; border:2px solid {{PRIMARY}}; opacity:0.06; }
  .c1 { width:700px; height:700px; top:-200px; right:-200px; }
  .c2 { width:500px; height:500px; bottom:-150px; left:-150px; }
  .content { text-align:center; max-width:820px; padding:0 60px; z-index:2; }
  .ornament { font-size:56px; color:{{PRIMARY}}; margin-bottom:48px; }
  .deco-line { width:90px; height:1.5px; background:{{PRIMARY}}; margin:0 auto; opacity:0.7; }
  .tag {
    font-size:28px; font-weight:700; text-transform:uppercase; letter-spacing:8px;
    color:{{PRIMARY}}; opacity:0.6; margin:40px 0 56px;
  }
  .lema {
    font-family:'Lora',serif; font-style:italic; font-size:78px; line-height:1.5;
    color:#F7F3EE; margin-bottom:64px;
  }
  .assinatura { font-family:'Parisienne',cursive; font-size:90px; color:{{PRIMARY}}; }
  .subtexto {
    font-size:28px; letter-spacing:4px; text-transform:uppercase;
    color:#F7F3EE; opacity:0.5; margin-top:24px;
  }
  .logo { position:absolute; bottom:88px; height:56px; left:50%; transform:translateX(-50%); opacity:0.85; z-index:2; }
  .handle { position:absolute; bottom:104px; left:90px; font-size:28px; font-weight:600; color:{{PRIMARY}}; opacity:0.7; z-index:2; }
</style>
</head>
<body>
  <div class="circle c1"></div><div class="circle c2"></div>
  <div class="content">
    <div class="ornament">&#10047;</div>
    <div class="deco-line"></div>
    <div class="tag">{{TAG}}</div>
    <div class="lema">{{LEMA}}</div>
    <div class="assinatura">{{ASSINATURA}}</div>
    <div class="subtexto">Casamentos modernos &middot; Mo&ccedil;ambique</div>
  </div>
  <div class="handle">@mcasei.mz</div>
  <img class="logo" src="logo-white.png" alt="mCasei">
</body>
</html>
