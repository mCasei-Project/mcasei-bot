<!DOCTYPE html>
<!--
  mCasei — Template Post 1 (Impacto) — 1080x1350px
  Placeholders a substituir: {{TAG}} {{TITULO}} {{SUBTITULO}} {{PRIMARY}} {{BG}} {{TEXT}} {{ACCENT}}
  O logo usado deve estar na mesma pasta: logo-color.png (fundo claro)
-->
<html lang="pt">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body {
    background:{{BG}};
    color:{{TEXT}};
    font-family:'Nunito Sans',sans-serif;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .frame {
    position:absolute; inset:48px;
    border:1.5px solid {{PRIMARY}}; opacity:0.4; pointer-events:none;
  }
  .corner { position:absolute; width:70px; height:70px; border:3px solid {{PRIMARY}}; }
  .corner.tl { top:64px; left:64px; border-right:none; border-bottom:none; }
  .corner.tr { top:64px; right:64px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:64px; left:64px; border-right:none; border-top:none; }
  .corner.br { bottom:64px; right:64px; border-left:none; border-top:none; }
  .content { text-align:center; max-width:780px; padding:0 40px; z-index:2; }
  .tag {
    font-size:30px; font-weight:700; text-transform:uppercase;
    letter-spacing:9px; color:{{ACCENT}}; margin-bottom:60px;
  }
  h1 {
    font-family:'Lora',serif; font-weight:700; font-size:100px; line-height:1.1;
    text-transform:uppercase; color:{{TEXT}}; margin-bottom:40px;
  }
  .subtitulo {
    font-family:'Parisienne',cursive; font-size:80px; color:{{PRIMARY}};
    line-height:1.2; margin-bottom:56px;
  }
  .sep { width:120px; height:2px; background:{{PRIMARY}}; margin:0 auto 56px; }
  .embreve {
    font-size:32px; font-weight:600; letter-spacing:13px;
    text-transform:uppercase; color:{{ACCENT}};
  }
  .logo { position:absolute; bottom:90px; left:90px; height:64px; z-index:2; }
  .handle {
    position:absolute; bottom:104px; right:90px; z-index:2;
    font-size:28px; font-weight:600; color:{{PRIMARY}};
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="content">
    <div class="tag">{{TAG}}</div>
    <h1>{{TITULO}}</h1>
    <div class="subtitulo">{{SUBTITULO}}</div>
    <div class="sep"></div>
    <div class="embreve">EM BREVE</div>
  </div>
  <img class="logo" src="logo-color.png" alt="mCasei">
  <div class="handle">@mcasei.mz</div>
</body>
</html>
