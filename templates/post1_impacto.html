<!DOCTYPE html>
<!--
  mCasei — Post 1 (Impacto) — 1080x1350 — DESIGN CLEAN (sem foto)
  Estilo: fundo rose + painel creme com cantos cortados + borda + titulo Playfair
  Placeholders: {{TITULO}} {{LINHA1}} {{LINHA2}} {{LINHA3}}
  Logo na mesma pasta: logo-black.png
-->
<html lang="pt"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;}
  body{background:#c76a67;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;}
  .panel{
    position:absolute;inset:0;background:#faf5f2;
    clip-path:polygon(16% 0,84% 0,100% 12%,100% 88%,84% 100%,16% 100%,0 88%,0 12%);
  }
  .border{
    position:absolute;inset:70px;border:1.5px solid #c76a67;opacity:0.55;
    clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%);
  }
  .content{
    position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 150px;
  }
  h1{
    font-family:'Playfair Display',serif;font-weight:600;font-size:92px;line-height:1.12;
    text-transform:uppercase;color:#c76a67;margin-bottom:50px;letter-spacing:1px;
  }
  .dot{width:26px;height:26px;border-radius:50%;background:#d9b46a;margin-bottom:72px;}
  .lines{display:flex;flex-direction:column;gap:46px;}
  .lines div{
    font-family:'DM Sans',sans-serif;font-weight:500;font-size:46px;color:#c2a06a;line-height:1.3;
  }
  .logo{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);height:130px;z-index:3;}
</style></head>
<body>
  <div class="panel"></div>
  <div class="border"></div>
  <div class="content">
    <h1>{{TITULO}}</h1>
    <div class="dot"></div>
    <div class="lines">
      <div>{{LINHA1}}</div>
      <div>{{LINHA2}}</div>
      <div>{{LINHA3}}</div>
    </div>
  </div>
  <img class="logo" src="logo-black.png" alt="mCasei">
</body></html>
