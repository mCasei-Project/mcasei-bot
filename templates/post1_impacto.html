<!DOCTYPE html>
<!--
  mCasei — Template Post 1 (Impacto) — 1080x1350px — FOTO + overlay vinho
  Placeholders: {{TAG}} {{TITULO}} {{SUBTITULO}} {{OVERLAY}}
  Ficheiros na mesma pasta: bg.jpg (foto de casal escolhida) + logo-white.png
  {{OVERLAY}} = cor rgba do overlay, ex: rgba(108,0,15,0.78) (vinho) ou rgba(26,26,26,0.55)
-->
<html lang="pt">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body {
    font-family:'Nunito Sans',sans-serif; position:relative; overflow:hidden;
    background:#1A1A1A;
  }
  .bg {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0;
  }
  .overlay { position:absolute; inset:0; background:{{OVERLAY}}; z-index:1; }
  .frame { position:absolute; inset:44px; border:1.5px solid rgba(247,243,238,0.45); z-index:2; pointer-events:none; }
  .content {
    position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 110px; color:#F7F3EE;
  }
  .tag {
    font-size:30px; font-weight:700; text-transform:uppercase;
    letter-spacing:9px; color:#F7F3EE; opacity:0.85; margin-bottom:54px;
  }
  h1 {
    font-family:'Lora',serif; font-weight:700; font-size:96px; line-height:1.12;
    text-transform:uppercase; color:#F7F3EE; margin-bottom:36px;
    text-shadow:0 2px 24px rgba(0,0,0,0.35);
  }
  .subtitulo {
    font-family:'Parisienne',cursive; font-size:82px; line-height:1.2;
    color:#F7F3EE; opacity:0.95; margin-bottom:48px;
  }
  .sep { width:130px; height:2px; background:rgba(247,243,238,0.8); margin-bottom:48px; }
  .embreve { font-size:30px; font-weight:600; letter-spacing:13px; text-transform:uppercase; opacity:0.85; }
  .logo { position:absolute; bottom:96px; left:50%; transform:translateX(-50%); height:84px; z-index:3; }
  .handle { position:absolute; bottom:54px; left:50%; transform:translateX(-50%); z-index:3; font-size:26px; font-weight:600; color:#F7F3EE; opacity:0.85; }
</style>
</head>
<body>
  <img class="bg" src="bg.jpg" alt="">
  <div class="overlay"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="tag">{{TAG}}</div>
    <h1>{{TITULO}}</h1>
    <div class="subtitulo">{{SUBTITULO}}</div>
    <div class="sep"></div>
    <div class="embreve">EM BREVE</div>
  </div>
  <img class="logo" src="logo-white.png" alt="mCasei">
  <div class="handle">@mcasei.mz</div>
</body>
</html>
